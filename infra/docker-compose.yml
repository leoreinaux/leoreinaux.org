# Servidor da newsletter e do analytics (ver infra/README.md e "Newsletter" em docs/arquitetura.md).
# O site não depende daqui: ele fica na Cloudflare e continua no ar se a VPS cair.
#
# Só o Caddy fica exposto (80 e 443); os outros serviços conversam pela rede interna.
# Variáveis e segredos vêm do arquivo .env (modelo em .env.example).

services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      LISTMONK_DOMINIO: ${LISTMONK_DOMINIO}
      UMAMI_DOMINIO: ${UMAMI_DOMINIO}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - listmonk
      - umami

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Banco do Listmonk; o do Umami é criado por postgres/init-umami.sh.
      POSTGRES_DB: listmonk
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      # A partir do PostgreSQL 18, a imagem guarda os dados em /var/lib/postgresql/<versão>.
      - postgres-dados:/var/lib/postgresql
      - ./postgres/init-umami.sh:/docker-entrypoint-initdb.d/init-umami.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d listmonk']
      interval: 10s
      timeout: 5s
      retries: 6

  listmonk:
    image: listmonk/listmonk:v6.2.0
    restart: unless-stopped
    # Instala o banco na primeira vez, aplica migrações nas atualizações e sobe o servidor.
    command: [sh, -c, './listmonk --install --idempotent --yes --config "" && ./listmonk --upgrade --yes --config "" && ./listmonk --config ""']
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: postgres
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${POSTGRES_USER}
      LISTMONK_db__password: ${POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      # Usuário administrador criado na instalação; depois, troque a senha pelo painel.
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - listmonk-uploads:/listmonk/uploads
    depends_on:
      postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy-dados:
  caddy-config:
  postgres-dados:
  listmonk-uploads:
