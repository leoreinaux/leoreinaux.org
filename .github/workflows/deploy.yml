name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; um push novo cancela o anterior ainda em andamento.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade
    uses: ./.github/workflows/qualidade.yml

  deploy:
    name: Build e publicação na Cloudflare
    # Só publica se acessibilidade e desempenho cumprirem as metas.
    needs: qualidade
    # Os secrets da Cloudflare e do Listmonk ficam no ambiente producao, restrito à main:
    # nenhum workflow de outro branch consegue publicar o site ou agendar a newsletter.
    environment:
      name: producao
      url: https://leoreinaux.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read, para o IndexNow achar o commit do último deploy publicado.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo, para o IndexNow comparar com o commit do deploy anterior.
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (astro check + astro build)
        run: npm run build

      - name: Publicar na Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Base do IndexNow: o commit do último deploy que terminou com sucesso. O "before" do push não serve,
      # porque um deploy cancelado por um push novo (concurrency acima) deixa o commit dele sem publicar.
      # Se a consulta falhar, volta ao "before"; o deploy não quebra por isso.
      - name: Commit do último deploy publicado
        id: anterior
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || sha=''
          echo "Último deploy publicado: ${sha:-não encontrado}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # Avisa os buscadores dos posts que mudaram desde o último deploy publicado; uma falha só gera aviso.
      - name: Avisar buscadores (IndexNow)
        run: node scripts/indexnow.ts
        env:
          BASE_SHA: ${{ steps.anterior.outputs.sha || github.event.before }}

      # Cria e agenda a campanha de cada post novo com newsletter: true; uma falha só gera aviso.
      - name: Agendar newsletter
        run: node scripts/newsletter.ts
        env:
          LISTMONK_API_USER: ${{ secrets.LISTMONK_API_USER }}
          LISTMONK_API_TOKEN: ${{ secrets.LISTMONK_API_TOKEN }}
